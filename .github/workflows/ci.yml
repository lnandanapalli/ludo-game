name: Ludo CI
on: [push, pull_request]
jobs:
  backend:
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/202611240001_rooms.sql
      - run: python -m pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  browser:
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r backend/requirements-dev.txt 'playwright>=1.50,<2'
      - run: python -m playwright install --with-deps chromium
      - run: npm ci && npm run build
        working-directory: frontend
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/202611240001_rooms.sql
      - name: Run browser integration test
        run: |
          (cd backend && uvicorn app.main:app --port 8000) &
          (cd frontend && npm run preview -- --port 5173 --strictPort) &
          for url in http://localhost:8000/health http://localhost:5173; do
            curl --fail --retry 15 --retry-connrefused --retry-delay 1 "$url" >/dev/null
          done
          python -m pytest tests/
